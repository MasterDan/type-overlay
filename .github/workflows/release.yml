name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

defaults:
  run:
    shell: bash

jobs:
  build:
    name: build (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows
            runner: windows-latest
            args: --bundles nsis
            rust-targets: ''
            artifacts: src-tauri/target/release/bundle/nsis/*.exe
          - label: macos
            runner: macos-latest
            # app+dmg: the .app must stay in bundle/macos for the signature check
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifacts: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - label: linux
            runner: ubuntu-22.04
            args: --bundles deb,rpm,appimage
            rust-targets: ''
            artifacts: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
    steps:
      - uses: actions/checkout@v5

      - name: install linux deps
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf libssl-dev \
            libgtk-3-dev libayatana-appindicator3-dev \
            meson ninja-build libwayland-dev wayland-protocols

      # gtk-layer-shell is not in the Ubuntu 22.04 repos (deb/AppImage are
      # built on 22.04 for old-glibc compatibility), so build it from source
      - name: build gtk-layer-shell
        if: matrix.label == 'linux'
        run: |
          git clone --depth 1 --branch v0.10.1 https://github.com/wmww/gtk-layer-shell
          meson setup gtk-layer-shell/build gtk-layer-shell \
            -Dprefix=/usr -Dintrospection=false -Dvapi=false
          sudo ninja -C gtk-layer-shell/build install

      # pnpm version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri build ${{ matrix.args }}

      # The .app must be ad-hoc signed as a bundle (binds Info.plist and
      # resources under the com.typeoverlay.app identity). Without it macOS TCC
      # cannot attach Accessibility / Input Monitoring permissions to the app.
      - name: verify macOS bundle signature
        if: matrix.label == 'macos'
        run: |
          ls "src-tauri/target/universal-apple-darwin/release/bundle/macos" || true
          codesign --verify --verbose=2 "src-tauri/target/universal-apple-darwin/release/bundle/macos/Type Overlay.app"

      - uses: actions/upload-artifact@v6
        with:
          name: artifacts-${{ matrix.label }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  build-arch:
    name: build (arch)
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v5

      - name: install system dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git zstd \
            webkit2gtk-4.1 gtk3 openssl librsvg libayatana-appindicator gtk-layer-shell

      # pnpm version comes from the packageManager field in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - run: pnpm tauri build

      - name: package arch artifacts
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          RT="$GITHUB_WORKSPACE"
          VER="${TAG#v}"

          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=Type Overlay' \
            'Comment=Keyboard overlay app' \
            'Exec=type-overlay' \
            'Icon=com.typeoverlay.app' \
            'Categories=Utility;' \
            'Terminal=false' \
            'StartupWMClass=Type Overlay' > "$RT/type-overlay.desktop"

          tar -C "$RT/src-tauri/target/release" -caf "$RT/type-overlay-$VER-x86_64-arch.tar.gz" type-overlay

          cat > "$RT/PKGBUILD" <<EOF
          pkgname=type-overlay
          pkgver=$VER
          pkgrel=1
          pkgdesc="Keyboard overlay app"
          arch=('x86_64')
          url="$REPO_URL"
          license=('MIT')
          depends=('webkit2gtk-4.1' 'gtk3' 'hicolor-icon-theme' 'gtk-layer-shell')
          optdepends=('libayatana-appindicator: system tray')

          package() {
            install -Dm755 "$RT/src-tauri/target/release/type-overlay" "\$pkgdir/usr/bin/type-overlay"
            install -Dm644 "$RT/type-overlay.desktop" "\$pkgdir/usr/share/applications/com.typeoverlay.app.desktop"
            install -Dm644 "$RT/src-tauri/icons/32x32.png" "\$pkgdir/usr/share/icons/hicolor/32x32/apps/com.typeoverlay.app.png"
            install -Dm644 "$RT/src-tauri/icons/64x64.png" "\$pkgdir/usr/share/icons/hicolor/64x64/apps/com.typeoverlay.app.png"
            install -Dm644 "$RT/src-tauri/icons/128x128.png" "\$pkgdir/usr/share/icons/hicolor/128x128/apps/com.typeoverlay.app.png"
            install -Dm644 "$RT/src-tauri/icons/128x128@2x.png" "\$pkgdir/usr/share/icons/hicolor/256x256/apps/com.typeoverlay.app.png"
          }
          EOF

          useradd -m builder 2>/dev/null || true
          chown -R builder:builder "$RT"
          su builder -c "cd '$RT' && makepkg --noconfirm --nodeps"

      - uses: actions/upload-artifact@v6
        with:
          name: artifacts-arch
          path: |
            *.pkg.tar.zst
            type-overlay-*-x86_64-arch.tar.gz
          if-no-files-found: error

  publish:
    name: publish to release
    runs-on: ubuntu-latest
    needs: [build, build-arch]
    if: github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.pkg.tar.zst
            artifacts/**/*.tar.gz
